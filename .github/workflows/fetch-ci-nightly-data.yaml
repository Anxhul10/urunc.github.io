name: Fetch CI Nightly Data
run-name: Fetch CI Nightly Data
on:
  schedule:
    - cron: '0 * * * *'
jobs:
  fetch-and-commit-data:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update dashboard data
      run: |
        node js/fetch-ci-nightly-data.js > data/ci-nightly-data.js

        git config user.name "GH Actions Workflow"
        git config user.email "gha@runner"

        git add data
        git commit -m "chore: add new data"
        git push
